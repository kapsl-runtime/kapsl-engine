[package]
name = "kapsl-mcp"
version = "0.2.3"
edition = "2021"
description = "Backend-neutral MCP server adapter for kapsl-engine"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
axum = "0.8"
rmcp = { version = "3.2.0", features = ["transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
