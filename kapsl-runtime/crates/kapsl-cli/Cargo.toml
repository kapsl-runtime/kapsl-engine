[package]
name = "kapsl"
version = "0.2.3"
edition = "2021"
rust-version.workspace = true

[features]
# Release profiles. Portable installers use `default`; the Linux CUDA bundle
# uses the stable shared-KV `cuda` alias below. The explicit `gguf-cuda`
# feature remains available as the llama.cpp native-KV rollback profile.
default = []
cuda = ["gguf-cuda-shared-kv"]

# Shared implementation switch for runtime-owned CUDA memory. It remains a
# separate feature so CI can type-check the memory authority without compiling
# a GGUF CUDA backend.
gpu-device-pool = [
    "dep:cudarc",
    # cudarc 0.12 only publishes bindings through CUDA 12.6. Pin that stable
    # driver API instead of rejecting newer, backward-compatible toolkits at
    # build time (the conformance image currently carries CUDA 13.0).
    "cudarc/cuda-12060",
    "kapsl-backends/onnx-cuda-pool",
    "kapsl-hal/cuda",
]

# Advanced backend profiles used by development and targeted deployments.
native = ["gpu-device-pool", "kapsl-backends/native"]
gguf-native = ["gpu-device-pool", "kapsl-backends/gguf-native"]
gguf-cuda = ["gpu-device-pool", "kapsl-backends/gguf-cuda", "kapsl-llm/gguf-cuda"]
gguf-cuda-shared-kv = ["gpu-device-pool", "kapsl-backends/gguf-cuda-shared-kv", "kapsl-llm/gguf-cuda-shared-kv"]

[build-dependencies]
cc = "1"

[dependencies]
kapsl-core = "0.3.0"
kapsl-hal = "0.3.0"
kapsl-engine-api = "0.3.0"
kapsl-backends = "0.3.0"
kapsl-scheduler = "0.3.0"
kapsl-ipc = "0.3.0"
kapsl-monitor = "0.3.0"
kapsl-transport = "0.3.0"
kapsl-shm = "0.3.0"
kapsl-llm = "0.3.0"
kapsl-kv-abi = "0.6.0"
kapsl-loader = "0.3.0"
kapsl-rag = "0.3.0"
kapsl-rag-sdk = "0.3.0"
kapsl-backend-abi = "=0.1.0"
warp = "0.3"
hyper = { version = "0.14", features = ["client", "http1", "stream", "tcp"] }
prometheus = "0.14"
parking_lot = "0.12"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
env_logger = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
serde_yaml = "0.9"
async-trait = "0.1"
async-channel = "2.3"
sysinfo = "0.30"
flate2 = "1.0"
tar = "0.4"
base64 = "0.22"
tokenizers = "0.20"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
ureq = { version = "=3.1.4", default-features = false, features = ["native-tls", "rustls"] }
rand = "0.8"
sha2 = "0.10"
rust-embed = "8.0"
mime_guess = "2.0"
dirs = "6.0.0"
cudarc = { version = "0.12", optional = true }
libc = "0.2"
ed25519-dalek = "2.1"
fs2 = "0.4"
semver = "1.0"
tempfile = "3.10"
libloading = "0.8"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["cuda", "tensorrt"] }
