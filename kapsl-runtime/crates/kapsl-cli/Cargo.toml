[package]
name = "kapsl"
version = "0.2.3"
edition = "2021"

[features]
# Release profiles. Portable installers use `default`; the Linux CUDA bundle
# uses the stable shared-KV `cuda` alias below. The explicit `gguf-cuda`
# feature remains available as the llama.cpp native-KV rollback profile.
default = []
cuda = ["gguf-cuda-shared-kv"]

# Shared implementation switch for runtime-owned CUDA memory. It remains a
# separate feature so CI can type-check the memory authority without compiling
# a GGUF CUDA backend.
gpu-device-pool = [
    "dep:cudarc",
    "cudarc/cuda-version-from-build-system",
    "kapsl-backends/onnx-cuda-pool",
    "kapsl-hal/cuda",
]

# Advanced backend profiles used by development and targeted deployments.
native = ["gpu-device-pool", "kapsl-backends/native"]
gguf-native = ["gpu-device-pool", "kapsl-backends/gguf-native"]
gguf-cuda = ["gpu-device-pool", "kapsl-backends/gguf-cuda", "kapsl-llm/gguf-cuda"]
gguf-cuda-shared-kv = ["gpu-device-pool", "kapsl-backends/gguf-cuda-shared-kv", "kapsl-llm/gguf-cuda-shared-kv"]

[build-dependencies]
cc = "1"

[dependencies]
kapsl-core = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-hal = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-engine-api = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-backends = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-scheduler = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-ipc = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-monitor = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-transport = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-shm = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-llm = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-rag = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
kapsl-rag-sdk = { git = "https://github.com/kapsl-runtime/kapsl-sdk.git", rev = "e02f03f445df66715a9130607ef7fd7b3448bf70" }
warp = "0.3"
prometheus = "0.14"
parking_lot = "0.12"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
env_logger = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
serde_yaml = "0.9"
async-trait = "0.1"
sysinfo = "0.30"
flate2 = "1.0"
tar = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
ureq = { version = "=3.1.4", default-features = false, features = ["native-tls", "rustls"] }
rand = "0.8"
sha2 = "0.10"
rust-embed = "8.0"
mime_guess = "2.0"
dirs = "6.0.0"
cudarc = { version = "0.12", optional = true }
