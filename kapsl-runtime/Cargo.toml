[workspace]
members = [
    "crates/kapsl-backend-llama-cpp",
    "crates/kapsl-cli",
    "crates/kapsl-mcp",
]
exclude = [
    "patches/esaxx-rs",
    "tests/native-adapter",
]

resolver = "2"

[workspace.package]
rust-version = "1.92"

[patch.crates-io]
esaxx-rs = { path = "patches/esaxx-rs" }
kapsl-llm = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-backends = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-engine-api = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-core = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-hal = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-kv-abi = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-loader = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-kernels = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-quantization = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-llama-cpp-2 = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
kapsl-llama-cpp-sys-2 = { git = "https://github.com/kapsl-runtime/kapsl-sdk", rev = "da01f3b486ef1c8b51dfca9862dc1826477c245f" }
