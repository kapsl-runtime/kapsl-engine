[workspace]
members = [
    "crates/kapsl-backend-llama-cpp",
    "crates/kapsl-cli",
    "crates/kapsl-mcp",
]
exclude = [
    "patches/esaxx-rs",
    "patches/kapsl-hal",
    "tests/native-adapter",
]

resolver = "2"

[workspace.package]
rust-version = "1.92"

[patch.crates-io]
esaxx-rs = { path = "patches/esaxx-rs" }
kapsl-hal = { path = "patches/kapsl-hal" }
