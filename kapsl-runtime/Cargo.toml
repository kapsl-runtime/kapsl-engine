[workspace]
members = [
    "crates/kapsl-backend-llama-cpp",
    "crates/kapsl-cli",
]
exclude = [
    "patches/esaxx-rs",
]

resolver = "2"

[workspace.package]
rust-version = "1.92"

[patch.crates-io]
esaxx-rs = { path = "patches/esaxx-rs" }

# Keep the temporary Git transport dependency on the same published API types
# as the engine's other SDK crates. Remove with the kapsl-grpc registry release.
[patch."https://github.com/kapsl-runtime/kapsl-sdk.git"]
kapsl-engine-api = { version = "=0.3.0" }
