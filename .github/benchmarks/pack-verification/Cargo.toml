[package]
name = "kapsl-pack-verification-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "kapsl-pack-verification-bench"
path = "main.rs"

[dependencies]
serde_json = "1.0"
# Match the engine's locked hash implementation for comparable measurements.
ring = "=0.17.14"

[dev-dependencies]
# Independent reference for SHA-256 compatibility at block/read boundaries.
sha2 = "=0.10.9"
tempfile = "3.10"
