name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-check:
    name: Cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-rust

      - name: Set up Rust (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Cache Cargo
        uses: ./.github/actions/cache-rust-build
        with:
          key: ci-check-${{ matrix.os }}

      - name: Check runtime workspace
        if: runner.os != 'Windows'
        run: cargo check --manifest-path kapsl-runtime/Cargo.toml --workspace --features grpc-server,mcp-server

      # Exercise the optional CUDA memory authority without requiring nvcc or a
      # GPU on the hosted runner. The gpu-device-pool feature pins the stable
      # cudarc CUDA API bindings used by production builds.
      - name: Test GPU device pool feature
        if: runner.os == 'Linux'
        run: >-
          cargo test --manifest-path kapsl-runtime/Cargo.toml -p kapsl
          --features gpu-device-pool -- --test-threads=1

      - name: Verify stable CUDA profile uses shared KV
        if: runner.os == 'Linux'
        run: |
          cargo metadata --manifest-path kapsl-runtime/Cargo.toml \
            --locked --no-deps --format-version 1 \
            | jq -e '[.packages[] | select(.name == "kapsl") | .features.cuda] == [["gguf-cuda-shared-kv"]]'

      - name: Test GPU integration harness contract
        if: runner.os == 'Linux'
        run: .github/scripts/test-gpu-device-pool-integration.sh --self-test

      - name: Check runtime CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INCLUDE: ${{ github.workspace }}/kapsl-runtime/crates/kapsl-cli;$env:INCLUDE
        run: cargo check --manifest-path kapsl-runtime/Cargo.toml --target x86_64-pc-windows-msvc -p kapsl --features grpc-server,mcp-server

  msrv:
    name: Cargo check (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up workspace MSRV
        uses: ./.github/actions/setup-rust
        with:
          msrv: true

      - name: Cache Cargo
        uses: ./.github/actions/cache-rust-build
        with:
          key: ci-msrv

      - name: Check runtime workspace on its minimum Rust version
        run: cargo check --manifest-path kapsl-runtime/Cargo.toml --workspace --locked --features grpc-server,mcp-server

  test:
    name: Cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-rust

      - name: Set up Rust (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Cache Cargo
        uses: ./.github/actions/cache-rust-build
        with:
          key: ci-test-${{ matrix.os }}

      - name: Test runtime workspace
        if: runner.os != 'Windows'
        run: cargo test --manifest-path kapsl-runtime/Cargo.toml --workspace --features grpc-server,mcp-server

      - name: Test runtime CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INCLUDE: ${{ github.workspace }}/kapsl-runtime/crates/kapsl-cli;$env:INCLUDE
        run: cargo test --manifest-path kapsl-runtime/Cargo.toml --target x86_64-pc-windows-msvc -p kapsl --features grpc-server,mcp-server
