name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  cargo-check:
    name: Cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Set up Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check runtime workspace
        if: runner.os != 'Windows'
        run: cargo check --manifest-path kapsl-runtime/Cargo.toml --workspace

      # Type-check the optional CUDA memory authority without requiring nvcc
      # or a GPU on the hosted runner. The fixed cudarc API feature takes
      # precedence over cuda-version-from-build-system for this compile only.
      - name: Check GPU device pool feature
        if: runner.os == 'Linux'
        run: >-
          cargo check --manifest-path kapsl-runtime/Cargo.toml -p kapsl
          --features gpu-device-pool,cudarc/cuda-12040

      - name: Check runtime CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INCLUDE: ${{ github.workspace }}/kapsl-runtime/crates/kapsl-cli;$env:INCLUDE
        run: cargo check --manifest-path kapsl-runtime/Cargo.toml --target x86_64-pc-windows-msvc -p kapsl


  test:
    name: Cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Set up Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test runtime workspace
        if: runner.os != 'Windows'
        run: cargo test --manifest-path kapsl-runtime/Cargo.toml --workspace

      - name: Test runtime CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INCLUDE: ${{ github.workspace }}/kapsl-runtime/crates/kapsl-cli;$env:INCLUDE
        run: cargo test --manifest-path kapsl-runtime/Cargo.toml --target x86_64-pc-windows-msvc -p kapsl
