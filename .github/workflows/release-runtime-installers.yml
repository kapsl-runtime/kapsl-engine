name: Release Runtime Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

jobs:
  build-runtime-installers:
    name: Build runtime installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches runtime version (Unix)
        if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          manifest_version="$(grep -m1 '^version = ' kapsl-runtime/crates/kapsl-cli/Cargo.toml | cut -d '"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Tag version ($tag_version) does not match kapsl runtime version ($manifest_version)."
            exit 1
          fi

      - name: Validate tag matches runtime version (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cargoToml = Get-Content "kapsl-runtime/crates/kapsl-cli/Cargo.toml"
          $manifestVersion = ($cargoToml | Where-Object { $_ -match '^version\s*=\s*".+"' } | Select-Object -First 1) -replace '.*"(.+)".*', '$1'
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($manifestVersion -ne $tagVersion) {
            throw "Tag version ($tagVersion) does not match kapsl runtime version ($manifestVersion)."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Set up Python for Windows dependency collection
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixBin) {
            Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          }

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Resolve runtime version (Unix)
        if: runner.os != 'Windows'
        run: |
          raw_version="$(grep -m1 '^version = ' kapsl-runtime/crates/kapsl-cli/Cargo.toml | cut -d '"' -f2)"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
            raw_version="${GITHUB_REF_NAME#v}"
          fi

          if [[ "$raw_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            numeric_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            numeric_version="0.1.0"
          fi

          deb_version="$(echo "$raw_version" | sed 's/-/~/g')"

          echo "KAPSL_VERSION=$raw_version" >> "$GITHUB_ENV"
          echo "KAPSL_NUMERIC_VERSION=$numeric_version" >> "$GITHUB_ENV"
          echo "KAPSL_DEB_VERSION=$deb_version" >> "$GITHUB_ENV"

      - name: Resolve runtime version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoToml = Get-Content "kapsl-runtime/crates/kapsl-cli/Cargo.toml"
          $rawVersion = ($cargoToml | Where-Object { $_ -match '^version\s*=\s*".+"' } | Select-Object -First 1) -replace '.*"(.+)".*', '$1'

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME) {
            $rawVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          }

          if ($rawVersion -match '^(\d+)\.(\d+)\.(\d+)') {
            $numericVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          } else {
            $numericVersion = "0.1.0"
          }

          $debVersion = $rawVersion -replace '-', '~'

          "KAPSL_VERSION=$rawVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KAPSL_NUMERIC_VERSION=$numericVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KAPSL_DEB_VERSION=$debVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build kapsl
        if: runner.os != 'Windows'
        run: cargo build --manifest-path kapsl-runtime/Cargo.toml -p kapsl --release

      - name: Build kapsl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C debuginfo=0 -C link-arg=/DEBUG:NONE
          CARGO_INCREMENTAL: "0"
          INCLUDE: ${{ github.workspace }}/kapsl-runtime/crates/kapsl-cli;$env:INCLUDE
        run: cargo build --manifest-path kapsl-runtime/Cargo.toml -p kapsl --release

      - name: Collect ONNX Runtime sidecar libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ort-runtime-libs

          search_roots=(
            "kapsl-runtime/target/release"
            "kapsl-runtime/target/release/deps"
            "${HOME}/.cache/ort.pyke.io/dfbin"
            "${HOME}/Library/Caches/ort.pyke.io/dfbin"
          )

          existing_roots=()
          for root in "${search_roots[@]}"; do
            if [ -d "$root" ]; then
              existing_roots+=("$root")
            fi
          done

          if [ "${#existing_roots[@]}" -eq 0 ]; then
            echo "No ORT search roots found; continuing without sidecar libraries."
            exit 0
          fi

          while IFS= read -r lib; do
            [ -n "$lib" ] || continue
            echo "Bundling ORT sidecar: $lib"
            cp -L "$lib" "ort-runtime-libs/$(basename "$lib")"
          done < <(
            find "${existing_roots[@]}" -type f \( \
              -name 'libonnxruntime*.so' -o \
              -name 'libonnxruntime*.so.*' -o \
              -name 'libonnxruntime*.dylib' -o \
              -name 'libonnxruntime*.dylib.*' \
            \) 2>/dev/null | sort -u
          )

          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64)
              missing=()
              for required in \
                libonnxruntime_providers_shared.so \
                libonnxruntime_providers_cuda.so
              do
                if [ ! -f "ort-runtime-libs/$required" ]; then
                  missing+=("$required")
                fi
              done
              if [ "${#missing[@]}" -gt 0 ]; then
                echo "Missing required Linux x64 ORT CUDA sidecar(s): ${missing[*]}" >&2
                exit 1
              fi
              ;;
          esac

          if [ -n "$(find ort-runtime-libs -type f -print -quit)" ]; then
            ls -la ort-runtime-libs
          else
            echo "No ORT sidecar libraries found for this platform/build."
          fi

      - name: Package Debian installer (.deb)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist pkgroot/DEBIAN pkgroot/usr/local/bin
          install -m 755 kapsl-runtime/target/release/kapsl pkgroot/usr/local/bin/kapsl
          if [ -d ort-runtime-libs ]; then
            cp -L ort-runtime-libs/* pkgroot/usr/local/bin/ 2>/dev/null || true
          fi

          arch="$(dpkg --print-architecture)"

          {
            echo "Package: kapsl-runtime"
            echo "Version: ${KAPSL_DEB_VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${arch}"
            echo "Maintainer: Kapsl Team <support@kapsl.ai>"
            echo "Description: Kapsl runtime CLI and local inference server."
          } > pkgroot/DEBIAN/control

          deb_path="dist/kapsl-runtime_${KAPSL_DEB_VERSION}_${arch}.deb"
          dpkg-deb --build pkgroot "${deb_path}"
          sha256sum "${deb_path}" > "${deb_path}.sha256"
          ls -la dist

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package macOS installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist pkgroot/usr/local/bin
          install -m 755 kapsl-runtime/target/release/kapsl pkgroot/usr/local/bin/kapsl
          if [ -d ort-runtime-libs ]; then
            cp -L ort-runtime-libs/* pkgroot/usr/local/bin/ 2>/dev/null || true
          fi

          arch_name="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          case "${arch_name}" in
            x64) arch_name="x86_64" ;;
            arm64) arch_name="aarch64" ;;
          esac

          unsigned_pkg="$RUNNER_TEMP/kapsl-runtime-unsigned.pkg"
          pkg_path="dist/kapsl-runtime-${KAPSL_VERSION}-macos-${arch_name}.pkg"

          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            while IFS= read -r -d '' dylib_path; do
              codesign --force --options runtime --sign "Developer ID Application: Kapsl ($APPLE_TEAM_ID)" \
                "$dylib_path"
            done < <(find pkgroot/usr/local/bin -type f -name 'libonnxruntime*.dylib*' -print0)
            codesign --force --options runtime --sign "Developer ID Application: Kapsl ($APPLE_TEAM_ID)" \
              pkgroot/usr/local/bin/kapsl
          else
            echo "APPLE_TEAM_ID is not set; building unsigned macOS package."
          fi

          pkgbuild \
            --root pkgroot \
            --identifier com.kapsl.runtime \
            --version "${KAPSL_NUMERIC_VERSION}" \
            --install-location / \
            "${unsigned_pkg}"

          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            productsign --sign "Developer ID Installer: Kapsl ($APPLE_TEAM_ID)" \
              "${unsigned_pkg}" "${pkg_path}"
          else
            cp "${unsigned_pkg}" "${pkg_path}"
          fi

          shasum -a 256 "${pkg_path}" > "${pkg_path}.sha256"
          ls -la dist

      - name: Notarize macOS installer
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          pkg_path="$(ls dist/*.pkg)"
          xcrun notarytool submit "${pkg_path}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${pkg_path}"

      - name: Package Windows installer (.msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path wix -Force | Out-Null

          $runnerArch = $env:RUNNER_ARCH.ToLower()
          $arch = $runnerArch
          if ($arch -eq "x64") { $arch = "x86_64" }
          if ($arch -eq "arm64") { $arch = "aarch64" }

          $wixArch = "x86"
          $programFilesFolderId = "ProgramFilesFolder"
          $win64 = "no"
          if ($runnerArch -eq "x64") {
            $wixArch = "x64"
            $programFilesFolderId = "ProgramFiles64Folder"
            $win64 = "yes"
          }
          if ($runnerArch -eq "arm64") {
            $wixArch = "arm64"
            $programFilesFolderId = "ProgramFiles64Folder"
            $win64 = "yes"
          }

          $msiName = "kapsl-runtime-$($env:KAPSL_VERSION)-windows-$arch.msi"
          Copy-Item "kapsl-runtime/target/release/kapsl.exe" "wix/kapsl.exe" -Force

          $ortSearchRoots = @(
            "kapsl-runtime/target/release",
            "kapsl-runtime/target/release/deps"
          )
          if ($env:LOCALAPPDATA) {
            $ortSearchRoots += Join-Path $env:LOCALAPPDATA "ort.pyke.io\dfbin"
          }
          if ($env:CARGO_HOME) {
            $ortSearchRoots += $env:CARGO_HOME
          } elseif ($env:USERPROFILE) {
            $ortSearchRoots += Join-Path $env:USERPROFILE ".cargo"
          }
          $ortSearchRoots = $ortSearchRoots | Where-Object { Test-Path $_ }

          $cudaProviderDll = Get-ChildItem -Path $ortSearchRoots -Filter "onnxruntime_providers_cuda.dll" -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $cudaProviderDll) {
            throw "Could not find onnxruntime_providers_cuda.dll after build. The Windows MSI would miss the ONNX Runtime CUDA provider sidecars."
          }

          $ortBundleDir = $cudaProviderDll.Directory.FullName
          $requiredOrtDlls = @(
            "onnxruntime_providers_shared.dll",
            "onnxruntime_providers_cuda.dll",
            "onnxruntime_providers_tensorrt.dll"
          )
          $missingOrtDlls = @($requiredOrtDlls | Where-Object { -not (Test-Path (Join-Path $ortBundleDir $_)) })
          if ($missingOrtDlls.Count -gt 0) {
            throw "ORT provider bundle at $ortBundleDir is missing required DLL(s): $($missingOrtDlls -join ', ')"
          }

          $ortDlls = @(Get-ChildItem -Path $ortBundleDir -Filter "*.dll" -File | Sort-Object Name)
          if ($ortDlls.Count -eq 0) {
            throw "No ORT DLLs found in $ortBundleDir"
          }

          Write-Host "Bundling ONNX Runtime DLLs from $ortBundleDir"
          foreach ($dll in $ortDlls) {
            Write-Host "  $($dll.Name)"
            Copy-Item $dll.FullName (Join-Path "wix" $dll.Name) -Force
          }

          $nvidiaDepsDir = Join-Path $env:RUNNER_TEMP "kapsl-nvidia-runtime-dlls"
          if (Test-Path $nvidiaDepsDir) {
            Remove-Item $nvidiaDepsDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $nvidiaDepsDir -Force | Out-Null

          python -m pip install --upgrade pip
          python -m pip install `
            --target $nvidiaDepsDir `
            --only-binary=:all: `
            --extra-index-url https://pypi.nvidia.com `
            "onnxruntime-gpu[cuda,cudnn]==1.23.2" `
            "tensorrt-cu12-libs==10.16.1.11"

          $nvidiaDlls = @(Get-ChildItem -Path $nvidiaDepsDir -Filter "*.dll" -Recurse -File |
            Where-Object { $_.Name -notlike "onnxruntime*.dll" } |
            Sort-Object Name -Unique)
          if ($nvidiaDlls.Count -eq 0) {
            throw "No NVIDIA runtime dependency DLLs found in $nvidiaDepsDir"
          }

          Write-Host "Bundling NVIDIA runtime dependency DLLs from $nvidiaDepsDir"
          foreach ($dll in $nvidiaDlls) {
            Write-Host "  $($dll.Name)"
            Copy-Item $dll.FullName (Join-Path "wix" $dll.Name) -Force
          }

          $requiredNvidiaDlls = @(
            "cublas64_12.dll",
            "cublasLt64_12.dll",
            "cudart64_12.dll",
            "cudnn64_9.dll",
            "cufft64_11.dll",
            "curand64_10.dll",
            "nvinfer_10.dll",
            "nvinfer_plugin_10.dll"
          )
          $missingNvidiaDlls = @($requiredNvidiaDlls | Where-Object { -not (Test-Path (Join-Path "wix" $_)) })
          if ($missingNvidiaDlls.Count -gt 0) {
            throw "NVIDIA runtime dependency collection is missing required DLL(s): $($missingNvidiaDlls -join ', ')"
          }

          $bundledDlls = @(Get-ChildItem -Path "wix" -Filter "*.dll" -File | Sort-Object Name)
          if ($bundledDlls.Count -eq 0) {
            throw "No bundled DLLs found in wix"
          }

          $ortDllComponentLines = @()
          $ortDllComponentRefLines = @()
          for ($i = 0; $i -lt $bundledDlls.Count; $i++) {
            $componentId = "OrtDllComponent$i"
            $fileId = "OrtDllFile$i"
            $fileName = $bundledDlls[$i].Name
            $ortDllComponentLines += "          <Component Id=""$componentId"" Guid=""*"" Win64=""$win64"">"
            $ortDllComponentLines += "            <File Id=""$fileId"" Source=""$fileName"" KeyPath=""yes"" />"
            $ortDllComponentLines += '          </Component>'
            $ortDllComponentRefLines += "      <ComponentRef Id=""$componentId"" />"
          }

          $wxsLines = @(
            '<?xml version="1.0" encoding="UTF-8"?>'
            '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">'
            '  <Product'
            '    Id="*"'
            '    Name="Kapsl Runtime"'
            '    Language="1033"'
            "    Version=""$($env:KAPSL_NUMERIC_VERSION)"""
            '    Manufacturer="Kapsl"'
            '    UpgradeCode="{DF997FCA-4EFD-447B-B368-376A32522B9B}">'
            '    <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />'
            '    <MajorUpgrade DowngradeErrorMessage="A newer version of Kapsl Runtime is already installed." />'
            '    <MediaTemplate EmbedCab="yes" />'
            '    <Directory Id="TARGETDIR" Name="SourceDir">'
            "      <Directory Id=""$programFilesFolderId"">"
            '        <Directory Id="INSTALLFOLDER" Name="Kapsl">'
            "          <Component Id=""KapslExeComponent"" Guid=""*"" Win64=""$win64"">"
            '            <File Id="KapslExeFile" Source="kapsl.exe" KeyPath="yes" />'
            '            <Environment Id="KapslPathEnv" Name="PATH" Value="[INSTALLFOLDER]" Action="set" Part="last" Permanent="no" System="yes" />'
            '          </Component>'
          ) + $ortDllComponentLines + @(
            '        </Directory>'
            '      </Directory>'
            '    </Directory>'
            '    <Feature Id="MainFeature" Title="Kapsl Runtime" Level="1">'
            '      <ComponentRef Id="KapslExeComponent" />'
          ) + $ortDllComponentRefLines + @(
            '    </Feature>'
            '  </Product>'
            '</Wix>'
          )
          $wxsLines | Set-Content -Path "wix/installer.wxs" -Encoding utf8

          Push-Location "wix"
          candle.exe -arch $wixArch installer.wxs
          light.exe installer.wixobj -o "../dist/$msiName"
          Pop-Location

          $hash = (Get-FileHash -Path "dist/$msiName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $msiName" | Set-Content -Path "dist/$msiName.sha256"

          Get-ChildItem dist

      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $msiPath = (Get-ChildItem "dist\*.msi").FullName
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
            /fd sha256 `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            /f $certPath `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            $msiPath

          $msiName = Split-Path $msiPath -Leaf
          $hash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $msiName" | Set-Content -Path "dist\$msiName.sha256"

          Remove-Item $certPath -Force

      - name: Package raw binary (Unix)
        if: runner.os != 'Windows'
        run: |
          arch_name="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          case "${arch_name}" in
            x64) arch_name="x86_64" ;;
            arm64) arch_name="aarch64" ;;
          esac
          os_name="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          bin_name="kapsl-${KAPSL_VERSION}-${os_name}-${arch_name}"
          cp kapsl-runtime/target/release/kapsl "dist/${bin_name}"
          chmod +x "dist/${bin_name}"
          sha256sum "dist/${bin_name}" > "dist/${bin_name}.sha256" 2>/dev/null || shasum -a 256 "dist/${bin_name}" > "dist/${bin_name}.sha256"

          bundle_root="dist/${bin_name}.bundle"
          mkdir -p "${bundle_root}"
          cp kapsl-runtime/target/release/kapsl "${bundle_root}/kapsl"
          chmod +x "${bundle_root}/kapsl"
          if [ -d ort-runtime-libs ]; then
            cp -L ort-runtime-libs/* "${bundle_root}/" 2>/dev/null || true
          fi
          tar_path="dist/${bin_name}.tar.gz"
          tar -C "${bundle_root}" -czf "${tar_path}" .
          rm -rf "${bundle_root}"
          sha256sum "${tar_path}" > "${tar_path}.sha256" 2>/dev/null || shasum -a 256 "${tar_path}" > "${tar_path}.sha256"

      - name: Package raw binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = $env:RUNNER_ARCH.ToLower()
          if ($arch -eq "x64") { $arch = "x86_64" }
          if ($arch -eq "arm64") { $arch = "aarch64" }
          $binName = "kapsl-$($env:KAPSL_VERSION)-windows-$arch.exe"
          Copy-Item "kapsl-runtime/target/release/kapsl.exe" "dist/$binName"
          $hash = (Get-FileHash -Path "dist/$binName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $binName" | Set-Content -Path "dist/$binName.sha256"

          $bundleName = "kapsl-$($env:KAPSL_VERSION)-windows-$arch.zip"
          $bundleRoot = "dist/kapsl-$($env:KAPSL_VERSION)-windows-$arch"
          New-Item -ItemType Directory -Path $bundleRoot -Force | Out-Null
          Copy-Item "wix/kapsl.exe" (Join-Path $bundleRoot "kapsl.exe") -Force
          Copy-Item "wix/*.dll" $bundleRoot -Force
          if (Test-Path "dist/$bundleName") {
            Remove-Item "dist/$bundleName" -Force
          }
          Compress-Archive -Path (Join-Path $bundleRoot "*") -DestinationPath "dist/$bundleName"
          Remove-Item $bundleRoot -Recurse -Force
          $bundleHash = (Get-FileHash -Path "dist/$bundleName" -Algorithm SHA256).Hash.ToLower()
          "$bundleHash  $bundleName" | Set-Content -Path "dist/$bundleName.sha256"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  upload-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-runtime-installers
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare GitHub release assets
        shell: bash
        run: |
          set -euo pipefail

          release_limit_bytes=2147483648
          mkdir -p github-release-assets
          oversized_names="${RUNNER_TEMP}/oversized-release-assets.txt"
          : > "$oversized_names"

          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "$file")"
            name="$(basename "$file")"
            if [ "$size" -ge "$release_limit_bytes" ]; then
              echo "$name" >> "$oversized_names"
              echo "::warning file=$file::Skipping GitHub release asset '$name' because it is ${size} bytes; GitHub requires each release asset to be under ${release_limit_bytes} bytes. The full file remains in workflow artifacts and R2 uploads."
            fi
          done < <(find release-assets -type f -print0)

          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "$file")"
            name="$(basename "$file")"
            if [ "$size" -ge "$release_limit_bytes" ]; then
              continue
            fi
            if [[ "$name" == *.sha256 ]]; then
              asset_name="${name%.sha256}"
              if grep -Fxq "$asset_name" "$oversized_names"; then
                echo "Skipping orphan checksum for oversized GitHub release asset: $name"
                continue
              fi
            fi
            cp "$file" "github-release-assets/$name"
          done < <(find release-assets -type f -print0)

          if [ -s "$oversized_names" ]; then
            {
              echo "The following assets exceeded GitHub Releases' 2 GiB per-file limit and were not attached to this GitHub release:"
              echo
              while IFS= read -r name; do
                echo "- $name"
              done < "$oversized_names"
              echo
              echo "Use the R2 release path or workflow artifacts for these files."
            } > github-release-assets/OVERSIZED_RELEASE_ASSETS.txt
          fi

          if [ -z "$(find github-release-assets -type f -print -quit)" ]; then
            echo "No GitHub release assets were prepared."
            exit 1
          fi

          find github-release-assets -maxdepth 1 -type f -print | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: github-release-assets/**

  upload-r2:
    needs: build-runtime-installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve upload version
        id: version
        shell: bash
        run: |
          # Always use the Cargo.toml version as the canonical version for
          # binary naming and paths. On workflow_dispatch (non-tag) runs,
          # prefix with "dev-" so test builds don't collide with releases.
          cargo_version="$(grep -m1 '^version = ' kapsl-runtime/crates/kapsl-cli/Cargo.toml | cut -d '"' -f2)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${cargo_version}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload installers to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp release-assets/ \
            s3://kapsl-installer/runtime/v${{ steps.version.outputs.version }}/ \
            --recursive \
            --no-progress \
            --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com

      - name: Upload install.sh to R2 (stable URL)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp install.sh \
            s3://kapsl-installer/install.sh \
            --content-type "text/plain" \
            --no-progress \
            --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com

      - name: Upload install.ps1 to R2 (stable URL)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp install.ps1 \
            s3://kapsl-installer/install.ps1 \
            --content-type "text/plain" \
            --no-progress \
            --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com

      - name: Update latest.txt in R2 (tagged releases only)
        if: steps.version.outputs.is_release == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo -n "${{ steps.version.outputs.version }}" \
            | aws s3 cp - \
              s3://kapsl-installer/runtime/latest.txt \
              --content-type "text/plain" \
              --no-progress \
              --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com
