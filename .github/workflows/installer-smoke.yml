name: Installer Smoke Tests

on:
  pull_request:
    paths:
      - "installers/**"
      - ".github/scripts/test-install-script.sh"
      - ".github/scripts/package-linux-cuda-runtime.sh"
      - ".github/scripts/test-package-linux-cuda-runtime.sh"
      - ".github/scripts/package-linux-onnx-backend-packs.sh"
      - ".github/scripts/package-linux-ort-cpu-backend.sh"
      - ".github/scripts/package-linux-ort-accelerator-backends.sh"
      - ".github/scripts/import-signed-backend-release.py"
      - ".github/scripts/test_import_signed_backend_release.py"
      - ".github/scripts/verify-ort-integration-checkout.sh"
      - ".github/ort-integration.lock"
      - ".github/ort-release.lock.json"
      - ".github/ort-cpu-parity.lock.json"
      - ".github/scripts/certify-ort-cpu-parity.sh"
      - ".github/scripts/collect-linux-tensorrt-runtime.sh"
      - ".github/scripts/onnx-backend-pack-entrypoint.c"
      - ".github/scripts/test-package-linux-onnx-backend-packs.sh"
      - ".github/scripts/test-package-linux-ort-cpu-backend.sh"
      - ".github/scripts/test-package-linux-ort-accelerator-backends.sh"
      - ".github/scripts/test-verify-ort-integration-checkout.sh"
      - ".github/scripts/test-onnx-backend-release-contract.sh"
      - ".github/licenses/ONNX-RUNTIME-LICENSE"
      - ".github/scripts/package-linux-llama-cpp-backend-packs.sh"
      - ".github/scripts/test-package-linux-llama-cpp-backend-packs.sh"
      - ".github/scripts/test-llama-cpp-backend-release-contract.sh"
      - ".github/scripts/benchmark-llama-cpp-backend-pack.py"
      - ".github/scripts/certify-llama-cpp-backend-pack-performance.sh"
      - ".github/scripts/test-gpu-device-pool-integration.sh"
      - ".github/workflows/lazy-llama-cpp-backend-pack-gpu-certification.yml"
      - ".github/licenses/LLAMA-CPP-LICENSE"
      - "kapsl-runtime/include/kapsl_llama_cpp_backend.h"
      - "kapsl-runtime/Cargo.lock"
      - "kapsl-runtime/Cargo.toml"
      - "kapsl-runtime/crates/kapsl-cli/Cargo.toml"
      - "kapsl-runtime/crates/kapsl-cli/src/app/cli/commands/backends.rs"
      - "kapsl-runtime/crates/kapsl-cli/src/app/cli/commands/packages.rs"
      - "kapsl-runtime/crates/kapsl-cli/src/backend/bundle.rs"
      - "kapsl-runtime/crates/kapsl-cli/src/backend/manager.rs"
      - "kapsl-runtime/crates/kapsl-backend-llama-cpp/**"
      - ".github/scripts/bootstrap-vllm-backend.sh"
      - ".github/scripts/package-linux-vllm-backend.sh"
      - ".github/scripts/managed-vllm-cu130.lock"
      - ".github/scripts/test-bootstrap-vllm-backend.sh"
      - ".github/scripts/test-managed-vllm-release-contract.sh"
      - ".github/scripts/managed_vllm_gpu_conformance.py"
      - ".github/scripts/test_managed_vllm_gpu_conformance.py"
      - ".github/scripts/managed_vllm_scaling_conformance.py"
      - ".github/scripts/test_managed_vllm_scaling_conformance.py"
      - ".github/scripts/managed_vllm_bridge_benchmark.py"
      - ".github/scripts/test_managed_vllm_bridge_benchmark.py"
      - ".github/scripts/certify-mixed-backend-concurrency.py"
      - ".github/scripts/test_certify_mixed_backend_concurrency.py"
      - ".github/workflows/vllm-shared-pool-conformance.yml"
      - ".github/workflows/gpu-device-pool-integration.yml"
      - ".github/workflows/release-runtime-installers.yml"
      - ".github/workflows/beta-runtime-installers.yml"
      - ".github/scripts/gcp_ephemeral_gpu_runner.py"
      - ".github/scripts/github_jit_runner.py"
      - ".github/scripts/validate_stable_gpu_release.py"
      - ".github/scripts/test_gcp_ephemeral_gpu_runner.py"
      - ".github/scripts/test_github_jit_runner.py"
      - ".github/scripts/validate_model_package_backend.py"
      - ".github/scripts/test_validate_model_package_backend.py"
      - "docs/gcp-ephemeral-gpu-conformance.md"
      - ".github/scripts/generate-backend-index.py"
      - ".github/scripts/test-generate-backend-index.sh"
      - ".github/scripts/verify-public-backend-release.sh"
      - ".github/workflows/installer-smoke.yml"
      - ".github/workflows/ort-cpu-conformance.yml"
  workflow_dispatch:
    inputs:
      public_release_version:
        description: "Diagnose public downloads for an existing version (without v); empty runs smoke tests"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-download-diagnostic:
    name: Diagnose public release downloads
    if: github.event_name == 'workflow_dispatch' && inputs.public_release_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public responses from the hosted runner
        env:
          RELEASE_VERSION: ${{ inputs.public_release_version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit("Invalid release version")
          channel = "runtime/beta" if "-" in version else "runtime"
          root = f"https://downloads.kapsl.net/{channel}/v{version}"
          failures = []
          subprocess.run(["curl", "--version"], check=True)
          with tempfile.TemporaryDirectory() as directory:
              headers = pathlib.Path(directory) / "headers"
              body = pathlib.Path(directory) / "body"

              def probe(url, head=False):
                  command = ["curl", "--silent", "--show-error", "--proto", "=https",
                             "--connect-timeout", "15", "--max-time", "30",
                             "--dump-header", str(headers), "--output", str(body),
                             "--write-out", "%{http_code}"]
                  if head:
                      command.append("--head")
                  result = subprocess.run(command + [url], capture_output=True, text=True)
                  print(f"{'HEAD' if head else 'GET'} {url}: HTTP {result.stdout}, curl exit {result.returncode}", flush=True)
                  if headers.exists():
                      for line in headers.read_text(errors="replace").splitlines():
                          if line.lower().startswith(("http/", "server:", "content-type:", "cf-ray:",
                                                      "cf-mitigated:", "cf-cache-status:", "location:")):
                              print(repr(line), flush=True)
                  if result.returncode != 0 or result.stdout != "200":
                      failures.append(url)
                      print(repr(result.stderr[:1024]), flush=True)
                      if not head and body.exists():
                          with body.open("rb") as response:
                              print(repr(response.read(2048).decode(errors="replace")), flush=True)
                      return None
                  return None if head else body.read_bytes()

              probe("https://downloads.kapsl.net/install.sh", head=True)
              index_bytes = probe(f"{root}/backend-index.json")
              probe(f"{root}/backend-index.json.sig")
              if index_bytes:
                  for pack in json.loads(index_bytes)["packs"]:
                      url = pack["artifact"]
                      if not url.startswith(root + "/") or "?" in url or "#" in url:
                          raise SystemExit("Artifact is outside the public release root")
                      probe(url, head=True)
          if failures:
              raise SystemExit(f"Public download verification failed for {len(failures)} object(s)")
          PY

  install-script:
    name: Test install.sh
    if: github.event_name != 'workflow_dispatch' || inputs.public_release_version == ''
    # Must be Linux x86_64: install.sh gates the CUDA runtime on that platform,
    # so nothing else exercises the paths this covers.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          sh -n installers/install.sh
          sh -n installers/install-cuda.sh
          sh -n installers/install-beta-cuda.sh
          sh -n installers/install-beta.sh
          sh -n .github/scripts/test-install-script.sh
          bash -n .github/scripts/package-linux-cuda-runtime.sh
          bash -n .github/scripts/test-package-linux-cuda-runtime.sh
          bash -n .github/scripts/package-linux-onnx-backend-packs.sh
          bash -n .github/scripts/package-linux-ort-cpu-backend.sh
          bash -n .github/scripts/package-linux-ort-accelerator-backends.sh
          bash -n .github/scripts/verify-ort-integration-checkout.sh
          bash -n .github/scripts/certify-ort-cpu-parity.sh
          bash -n .github/scripts/collect-linux-tensorrt-runtime.sh
          bash -n .github/scripts/test-package-linux-onnx-backend-packs.sh
          bash -n .github/scripts/test-package-linux-ort-cpu-backend.sh
          bash -n .github/scripts/test-package-linux-ort-accelerator-backends.sh
          bash -n .github/scripts/test-verify-ort-integration-checkout.sh
          bash -n .github/scripts/test-onnx-backend-release-contract.sh
          bash -n .github/scripts/package-linux-llama-cpp-backend-packs.sh
          bash -n .github/scripts/test-package-linux-llama-cpp-backend-packs.sh
          bash -n .github/scripts/test-llama-cpp-backend-release-contract.sh
          bash -n .github/scripts/certify-llama-cpp-backend-pack-performance.sh
          bash -n .github/scripts/bootstrap-vllm-backend.sh
          bash -n .github/scripts/package-linux-vllm-backend.sh
          bash -n .github/scripts/test-bootstrap-vllm-backend.sh
          bash -n .github/scripts/test-managed-vllm-release-contract.sh
          bash -n .github/scripts/verify-managed-vllm-sdk-checkout.sh
          bash -n .github/scripts/test-verify-managed-vllm-sdk-checkout.sh
          bash -n .github/scripts/test-verify-managed-vllm-connector-wheel.sh
          bash -n .github/scripts/test-generate-backend-index.sh
          bash -n .github/scripts/verify-public-backend-release.sh
          python3 -m py_compile .github/scripts/generate-backend-index.py
          python3 -m py_compile .github/scripts/import-signed-backend-release.py
          python3 -m py_compile .github/scripts/test_import_signed_backend_release.py
          python3 -m py_compile .github/scripts/benchmark-llama-cpp-backend-pack.py
          python3 -m py_compile .github/scripts/verify-managed-vllm-connector-wheel.py
          python3 -m py_compile .github/scripts/managed_vllm_gpu_conformance.py
          python3 -m py_compile .github/scripts/test_managed_vllm_gpu_conformance.py
          python3 -m py_compile .github/scripts/managed_vllm_bridge_benchmark.py
          python3 -m py_compile .github/scripts/test_managed_vllm_bridge_benchmark.py
          python3 -m py_compile .github/scripts/managed_vllm_scaling_conformance.py
          python3 -m py_compile .github/scripts/test_managed_vllm_scaling_conformance.py
          python3 -m py_compile .github/scripts/certify-mixed-backend-concurrency.py
          python3 -m py_compile .github/scripts/test_certify_mixed_backend_concurrency.py
          python3 -m py_compile .github/scripts/gcp_ephemeral_gpu_runner.py
          python3 -m py_compile .github/scripts/github_jit_runner.py
          python3 -m py_compile .github/scripts/validate_stable_gpu_release.py
          python3 -m py_compile .github/scripts/test_gcp_ephemeral_gpu_runner.py
          python3 -m py_compile .github/scripts/test_github_jit_runner.py
          python3 -m py_compile .github/scripts/validate_model_package_backend.py
          python3 -m py_compile .github/scripts/test_validate_model_package_backend.py

      - name: Test llama.cpp performance threshold math
        run: .github/scripts/benchmark-llama-cpp-backend-pack.py self-test

      - name: Test merged accelerator selection and compatibility
        run: .github/scripts/test-install-script.sh

      - name: Test merged CUDA archive contents
        run: .github/scripts/test-package-linux-cuda-runtime.sh

      - name: Test certified ORT CPU release handoff
        run: .github/scripts/test-package-linux-ort-cpu-backend.sh

      - name: Test certified ORT accelerator release handoff
        run: .github/scripts/test-package-linux-ort-accelerator-backends.sh

      - name: Test immutable signed backend-release import
        run: python3 .github/scripts/test_import_signed_backend_release.py

      - name: Test exact ORT integrations checkout verification
        run: .github/scripts/test-verify-ort-integration-checkout.sh

      - name: Test legacy ONNX accelerator packs
        run: .github/scripts/test-package-linux-onnx-backend-packs.sh

      - name: Test ONNX backend release contract
        run: .github/scripts/test-onnx-backend-release-contract.sh

      - name: Test native llama.cpp backend packs
        run: .github/scripts/test-package-linux-llama-cpp-backend-packs.sh

      - name: Test llama.cpp backend release contract
        run: .github/scripts/test-llama-cpp-backend-release-contract.sh

      - name: Test managed-vLLM backend bootstrap
        run: .github/scripts/test-bootstrap-vllm-backend.sh

      - name: Test managed-vLLM release pins
        run: .github/scripts/test-managed-vllm-release-contract.sh

      - name: Test managed-vLLM SDK checkout verification
        run: .github/scripts/test-verify-managed-vllm-sdk-checkout.sh

      - name: Test managed-vLLM connector wheel verification
        run: .github/scripts/test-verify-managed-vllm-connector-wheel.sh

      - name: Test managed-vLLM GPU conformance evidence parser
        run: python3 .github/scripts/test_managed_vllm_gpu_conformance.py

      - name: Test managed-vLLM bridge performance gate math
        run: python3 .github/scripts/test_managed_vllm_bridge_benchmark.py

      - name: Test managed-vLLM scaling evidence parser
        run: python3 .github/scripts/test_managed_vllm_scaling_conformance.py

      - name: Test managed-vLLM mixed-backend memory gates
        run: python3 .github/scripts/test_certify_mixed_backend_concurrency.py

      - name: Test ephemeral GCE GPU runner lifecycle
        run: python3 .github/scripts/test_gcp_ephemeral_gpu_runner.py

      - name: Test GitHub JIT runner lifecycle
        run: python3 .github/scripts/test_github_jit_runner.py

      - name: Test model-package serving contract validation
        run: python3 .github/scripts/test_validate_model_package_backend.py

      - name: Test signed backend-index generation
        run: .github/scripts/test-generate-backend-index.sh
