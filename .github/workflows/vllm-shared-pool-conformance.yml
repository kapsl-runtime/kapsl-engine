          98412137ae43c77f8af52eb51b19c3536d3242cb55339167d841005fa94a23b7  special_tokens_map.json
          1fe93b6152957cf9cfd6d89002467f789ce8b3f3e000b3a2edf27c808ddd0b9e  tokenizer.json
