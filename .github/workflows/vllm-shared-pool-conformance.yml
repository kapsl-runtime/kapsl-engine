              except Exception as error:
                  last_error = error
                  time.sleep(1)
          else:
              raise SystemExit(f"fixed exact metrics did not converge: {last_error}")
          PY
          )
          echo "DIRECT_KV_BYTES=$direct_kv_bytes" >> "$GITHUB_ENV"
