            done
            if kill -0 "$CROSSOVER_RUNTIME_PID" 2>/dev/null; then
              kill -KILL "$CROSSOVER_RUNTIME_PID"
            fi
            wait "$CROSSOVER_RUNTIME_PID" || true
          fi
          if [[ -f "$OUTPUT_DIR/nvml-before-crossover.txt" ]]; then
            released=0
            for _ in $(seq 1 60); do
              pending=0
              : > "$OUTPUT_DIR/nvml-after-crossover.txt"
              while read -r device before; do
                after=$(nvidia-smi --id="$device" --query-gpu=memory.used --format=csv,noheader,nounits)
                printf '%s %s\n' "$device" "$after" >> "$OUTPUT_DIR/nvml-after-crossover.txt"
                (( after <= before + 128 )) || pending=1
              done < "$OUTPUT_DIR/nvml-before-crossover.txt"
              if (( pending == 0 )); then
                released=1
                break
              fi
              sleep 1
            done
            if (( released == 0 )); then
              while read -r device before; do
                after=$(awk -v device="$device" '$1 == device { print $2 }' "$OUTPUT_DIR/nvml-after-crossover.txt")
                echo "GPU $device retained $((after - before)) MiB after crossover shutdown" >&2
              done < "$OUTPUT_DIR/nvml-before-crossover.txt"
              exit 1
            fi
          fi

      - name: Start fixed vLLM for llama.cpp co-residency
        shell: bash
        run: |
          set -Eeuo pipefail
          mixed_dir="$RUNNER_TEMP/kapsl-vllm-mixed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 "$mixed_dir"
          mixed_port=$(python3 - <<'PY'
          import socket
          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          )
          IFS=, read -ra physical_devices <<< "$CUDA_VISIBLE_DEVICES"
          : > "$OUTPUT_DIR/nvml-before-mixed.txt"
          for device in "${physical_devices[@]}"; do
            used=$(nvidia-smi --id="$device" --query-gpu=memory.used --format=csv,noheader,nounits)
            printf '%s %s\n' "$device" "$used" >> "$OUTPUT_DIR/nvml-before-mixed.txt"
          done
          KAPSL_VLLM_PYTHON="$VENV_DIR/bin/python" \
          KAPSL_VLLM_MEMORY_MODE=exact \
          KAPSL_VLLM_BRIDGE_MODE=wire \
          KAPSL_LLAMA_CPP_ALLOW_NATIVE_KV=0 \
          KAPSL_GGUF_DISABLE_SHARED_KV=0 \
          KAPSL_GPU_DEVICE_POOL_MODE=auto \
          "$RUNTIME_BINARY" run "$FIXED_PACKAGE" \
            --transport socket \
            --socket "$mixed_dir/inference.sock" \
            --state-dir "$mixed_dir/state" \
            --metrics-port "$mixed_port" \
            --http-bind 127.0.0.1 \
            --topology tensor-parallel \
            --tp-degree "$TP_SIZE" \
            > "$OUTPUT_DIR/mixed-runtime.log" 2>&1 &
          mixed_pid=$!
          {
            echo "MIXED_RUNTIME_PID=$mixed_pid"
            echo "MIXED_HTTP_BASE=http://127.0.0.1:$mixed_port"
          } >> "$GITHUB_ENV"
          for _ in $(seq 1 900); do
            if curl --fail --silent "http://127.0.0.1:$mixed_port/api/health" \
              | grep -q '"healthy_models":[1-9]'; then
              exit 0
            fi
            kill -0 "$mixed_pid" 2>/dev/null || break
            sleep 1
          done
          sed -n '1,320p' "$OUTPUT_DIR/mixed-runtime.log" >&2
          exit 1

      - name: Add llama.cpp and certify concurrent mixed-backend service
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$MIXED_HTTP_BASE" "$LLAMA_PACKAGE" \
            "$OUTPUT_DIR/llama-start-response.json" <<'PY'
          import json
          import sys
          import time
          import urllib.request

          base, package, output = sys.argv[1:]
          request = urllib.request.Request(
              base + "/api/models/start",
              data=json.dumps(
                  {"model_path": package, "topology": "data-parallel", "tp_degree": 1},
                  separators=(",", ":"),
              ).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=900) as response:
              result = json.load(response)
          with open(output, "w", encoding="utf-8") as stream:
              json.dump(result, stream, indent=2, sort_keys=True)
              stream.write("\n")
          deadline = time.monotonic() + 900
          while time.monotonic() < deadline:
              with urllib.request.urlopen(base + "/api/models", timeout=30) as response:
                  rows = json.load(response)
              active = {
                  row.get("name") for row in rows
                  if row.get("status") == "active" and row.get("replica_id") == 0
              }
              if {
                  "qwen2.5-0.5b-vllm-fixed",
                  "qwen2.5-0.5b-llama",
              }.issubset(active):
                  break
              time.sleep(1)
          else:
              raise SystemExit(f"mixed models did not become active: {rows!r}")
          PY
          python3 engine/.github/scripts/certify-mixed-backend-concurrency.py \
            --base-url "$MIXED_HTTP_BASE" \
            --metrics-url "$MIXED_HTTP_BASE/metrics" \
            --llama-model qwen2.5-0.5b-llama \
            --vllm-model qwen2.5-0.5b-vllm-fixed \
            --output "$OUTPUT_DIR/mixed-backend-conformance.json"
          python3 - "$OUTPUT_DIR/mixed-backend-conformance.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("schema_version") != 1:
              raise SystemExit("mixed-backend report has an unsupported schema")
          if report.get("status") != "passed" or report.get("failures") != []:
              raise SystemExit(
                  f"mixed-backend report did not pass: {report.get('failures')!r}"
              )
          memory = report.get("memory")
          if not isinstance(memory, dict):
              raise SystemExit("mixed-backend report has no memory evidence")

          def require_positive_map(name):
              values = memory.get(name)
              if not isinstance(values, dict) or not values or any(
                  isinstance(value, bool) or not isinstance(value, int) or value <= 0
                  for value in values.values()
              ):
                  raise SystemExit(
                      f"mixed-backend report has invalid {name}: {values!r}"
                  )
              return values

          backing = require_positive_map("vllm_backing_bytes")
          llama_usage = require_positive_map("llama_owner_usage_bytes")
          if set(llama_usage) - set(backing):
              raise SystemExit("llama.cpp and managed vLLM did not share a device")
          if not str(memory.get("llama_kv_owner", "")).endswith(":kv-cache"):
              raise SystemExit("mixed-backend report has no shared-pool KV owner")
          quarantine = memory.get("vllm_quarantine_bytes")
          if not isinstance(quarantine, dict) or set(quarantine) != set(backing) or any(
              isinstance(value, bool) or not isinstance(value, int) or value != 0
              for value in quarantine.values()
          ):
              raise SystemExit(
                  f"mixed-backend report contains quarantined memory: {quarantine!r}"
              )
          released = memory.get("post_completion")
          released_allocated = (
              released.get("general_pool_allocated_bytes")
              if isinstance(released, dict)
              else None
          )
          if (
              not isinstance(released_allocated, dict)
              or set(released_allocated) != set(llama_usage)
              or any(
                  isinstance(value, bool) or not isinstance(value, int) or value != 0
                  for value in released_allocated.values()
              )
          ):
              raise SystemExit("mixed-backend report did not prove KV release")
          PY

      - name: Stop mixed runtime and prove clean co-resident release
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
