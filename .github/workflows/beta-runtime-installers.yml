name: Beta Runtime Installers

on:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: beta-runtime-installers
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
  WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

jobs:
  prepare-version:
    name: Resolve beta version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric_version: ${{ steps.version.outputs.numeric_version }}
      deb_version: ${{ steps.version.outputs.deb_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve the date exactly once. The CUDA build can span UTC midnight, so
      # recomputing it independently in each job can produce a release whose
      # tag and artifact filenames disagree.
      - name: Resolve beta version
        id: version
        shell: bash
        run: |
          manifest_version="$(grep -m1 '^version = ' kapsl-runtime/crates/kapsl-cli/Cargo.toml | cut -d '"' -f2)"
          short_sha="${GITHUB_SHA::8}"
          date_str="$(date -u +%Y%m%d)"
          version="${manifest_version}-beta.${date_str}.${short_sha}"

          if [ "${GITHUB_RUN_NUMBER}" -gt 65535 ]; then
            echo "GITHUB_RUN_NUMBER exceeds Windows Installer's 65535 build-version limit." >&2
            exit 1
          fi
          if [[ "$manifest_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            numeric_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${GITHUB_RUN_NUMBER}"
          else
            numeric_version="0.1.0"
          fi

          deb_version="${version/-/\~}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric_version=$numeric_version" >> "$GITHUB_OUTPUT"
          echo "deb_version=$deb_version" >> "$GITHUB_OUTPUT"

  build-runtime-installers:
    name: Build runtime installer (${{ matrix.os }})
    needs: prepare-version
    runs-on: ${{ matrix.os }}
    env:
      KAPSL_VERSION: ${{ needs.prepare-version.outputs.version }}
      KAPSL_NUMERIC_VERSION: ${{ needs.prepare-version.outputs.numeric_version }}
      KAPSL_DEB_VERSION: ${{ needs.prepare-version.outputs.deb_version }}
      KAPSL_BACKEND_PUBLIC_KEYS: ${{ secrets.KAPSL_BACKEND_PUBLIC_KEYS }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 (not ubuntu-latest) so the linux-x86_64 binary links
        # against glibc 2.35 instead of 24.04's 2.39 — see
        # release-runtime-installers.yml for the full explanation.
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Python for accelerator dependency collection
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixBin) {
            Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          }

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Build kapsl
        if: runner.os != 'Windows'
        run: cargo build --manifest-path kapsl-runtime/Cargo.toml -p kapsl --release

      - name: Build kapsl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C debuginfo=0 -C link-arg=/DEBUG:NONE
          CARGO_INCREMENTAL: "0"
          INCLUDE: ${{ github.workspace }}/kapsl-runtime/crates/kapsl-cli;$env:INCLUDE
        run: cargo build --manifest-path kapsl-runtime/Cargo.toml -p kapsl --release

      - name: Collect ONNX Runtime sidecar libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: .github/scripts/collect-ort-sidecars.sh

      - name: Package Debian installer (.deb)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist pkgroot/DEBIAN pkgroot/usr/local/bin pkgroot/etc/ld.so.conf.d
          install -m 755 kapsl-runtime/target/release/kapsl pkgroot/usr/local/bin/kapsl
          if [ -d ort-core-libs ]; then
            cp -L ort-core-libs/* pkgroot/usr/local/bin/ 2>/dev/null || true
          fi

          # ONNX Runtime dlopen()s libonnxruntime_providers_shared.so by bare
          # name, and /usr/local/bin is not a loader search path. Without this
          # the accelerator packs register no provider and the runtime serves
          # every request from the CPU while holding the GPU.
          echo "/usr/local/bin" > pkgroot/etc/ld.so.conf.d/kapsl-runtime.conf

          arch="$(dpkg --print-architecture)"

          {
            echo "Package: kapsl-runtime"
            echo "Version: ${KAPSL_DEB_VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${arch}"
            echo "Maintainer: Kapsl Team <support@kapsl.ai>"
            echo "Description: Kapsl runtime CLI and local inference server (beta)."
          } > pkgroot/DEBIAN/control

          # The conf file only takes effect once the cache is rebuilt, and dpkg
          # triggers ldconfig on its own only for standard library directories.
          for script in postinst postrm; do
            {
              echo "#!/bin/sh"
              echo "set -e"
              echo "ldconfig"
            } > "pkgroot/DEBIAN/${script}"
            chmod 755 "pkgroot/DEBIAN/${script}"
          done

          deb_path="dist/kapsl-runtime_${KAPSL_DEB_VERSION}_${arch}.deb"
          dpkg-deb --build pkgroot "${deb_path}"
          sha256sum "${deb_path}" > "${deb_path}.sha256"
          ls -la dist

      - name: Package Linux accelerator packs
        if: runner.os == 'Linux'
        shell: bash
        run: .github/scripts/package-linux-provider-packs.sh

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package macOS installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist pkgroot/usr/local/bin
          install -m 755 kapsl-runtime/target/release/kapsl pkgroot/usr/local/bin/kapsl
          if [ -d ort-core-libs ]; then
            cp -L ort-core-libs/* pkgroot/usr/local/bin/ 2>/dev/null || true
          fi

          arch_name="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          case "${arch_name}" in
            x64) arch_name="x86_64" ;;
            arm64) arch_name="aarch64" ;;
          esac

          unsigned_pkg="$RUNNER_TEMP/kapsl-runtime-unsigned.pkg"
          pkg_path="dist/kapsl-runtime-${KAPSL_VERSION}-macos-${arch_name}.pkg"

          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            while IFS= read -r -d '' dylib_path; do
              codesign --force --options runtime --sign "Developer ID Application: Kapsl ($APPLE_TEAM_ID)" \
                "$dylib_path"
            done < <(find pkgroot/usr/local/bin -type f -name 'libonnxruntime*.dylib*' -print0)
            codesign --force --options runtime --sign "Developer ID Application: Kapsl ($APPLE_TEAM_ID)" \
              pkgroot/usr/local/bin/kapsl
          else
            echo "APPLE_TEAM_ID is not set; building unsigned macOS package."
          fi

          pkgbuild \
            --root pkgroot \
            --identifier com.kapsl.runtime \
            --version "${KAPSL_NUMERIC_VERSION}" \
            --install-location / \
            "${unsigned_pkg}"

          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            productsign --sign "Developer ID Installer: Kapsl ($APPLE_TEAM_ID)" \
              "${unsigned_pkg}" "${pkg_path}"
          else
            cp "${unsigned_pkg}" "${pkg_path}"
          fi

          shasum -a 256 "${pkg_path}" > "${pkg_path}.sha256"
          ls -la dist

      - name: Notarize macOS installer
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          pkg_path="$(ls dist/*.pkg)"
          xcrun notarytool submit "${pkg_path}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${pkg_path}"

      - name: Package Windows installer (.msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .github/scripts/package-windows-runtime.ps1 `
            -Version $env:KAPSL_VERSION `
            -NumericVersion $env:KAPSL_NUMERIC_VERSION `
            -ProductName "Kapsl Runtime (Beta)" `
            -UpgradeCode "{A1B2C3D4-5E6F-7A8B-9C0D-1E2F3A4B5C6D}"

      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          foreach ($msi in (Get-ChildItem "dist\*.msi" -File)) {
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
              /fd sha256 `
              /tr http://timestamp.digicert.com `
              /td sha256 `
              /f $certPath `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              $msi.FullName

            $hash = (Get-FileHash -Path $msi.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($msi.Name)" | Set-Content -Path "dist\$($msi.Name).sha256"
          }

          Remove-Item $certPath -Force

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-cuda-runtime:
    name: Build CUDA runtime (linux-x86_64)
    needs: prepare-version
    runs-on: ubuntu-22.04
    container:
      # Match the stable release: this image supplies the CUDA/cuDNN libraries
      # folded into the one GGUF + ONNX accelerator archive.
      image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CUDA_PATH: /usr/local/cuda
      KAPSL_NVIDIA_LICENSE_FILE: /NGC-DL-CONTAINER-LICENSE
      KAPSL_VERSION: ${{ needs.prepare-version.outputs.version }}
      KAPSL_BACKEND_PUBLIC_KEYS: ${{ secrets.KAPSL_BACKEND_PUBLIC_KEYS }}
      KAPSL_VLLM_SDK_REF: ${{ vars.KAPSL_VLLM_SDK_REF }}
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs:/usr/local/cuda/targets/x86_64-linux/lib/stubs
    steps:
      - name: Install CUDA build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates clang cmake curl file git libclang-dev libssl-dev openssl patchelf pkg-config python3 python3-pip
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve certified ORT integrations commit
        id: ort-integrations
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\r\n' < .github/ort-integration.lock)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo ".github/ort-integration.lock must contain one exact lowercase 40-hex commit." >&2
            exit 1
          fi
          echo "KAPSL_ORT_INTEGRATIONS_REF=$ref" >> "$GITHUB_ENV"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout certified ORT adapter
        uses: actions/checkout@v4
        with:
          repository: kapsl-runtime/kapsl-integrations
          ref: ${{ steps.ort-integrations.outputs.ref }}
          path: kapsl-integrations-ort

      - name: Verify certified ORT integrations checkout
        shell: bash
        run: .github/scripts/verify-ort-integration-checkout.sh kapsl-integrations-ort "$KAPSL_ORT_INTEGRATIONS_REF"

      - name: Validate certified vLLM SDK commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KAPSL_VLLM_SDK_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Protected KAPSL_VLLM_SDK_REF must be an exact lowercase 40-hex commit." >&2
            exit 1
          fi

      - name: Checkout certified vLLM connector
        uses: actions/checkout@v4
        with:
          repository: kapsl-runtime/kapsl-sdk
          ref: ${{ env.KAPSL_VLLM_SDK_REF }}
          path: sdk-vllm

      - name: Verify certified vLLM SDK checkout
        shell: bash
        run: .github/scripts/verify-managed-vllm-sdk-checkout.sh sdk-vllm "$KAPSL_VLLM_SDK_REF"

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Install certified ORT packaging toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' kapsl-integrations-ort/rust-toolchain.toml | head -n 1)"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Build kapsl with statically compiled GGUF CUDA
        run: cargo build --manifest-path kapsl-runtime/Cargo.toml --locked -p kapsl --release --no-default-features --features cuda

      - name: Collect ONNX Runtime sidecars
        shell: bash
        run: .github/scripts/collect-ort-sidecars.sh

      - name: Collect TensorRT 10 user-space runtime
        shell: bash
        run: .github/scripts/collect-linux-tensorrt-runtime.sh

      - name: Package CUDA runtime bundle
        shell: bash
        run: .github/scripts/package-linux-cuda-runtime.sh

      - name: Package certified ORT CPU adapter
        shell: bash
        run: .github/scripts/package-linux-ort-cpu-backend.sh

      - name: Package legacy ONNX accelerator packs
        shell: bash
        run: .github/scripts/package-linux-onnx-backend-packs.sh

      - name: Package llama.cpp backend packs from published SDK crates
        shell: bash
        run: .github/scripts/package-linux-llama-cpp-backend-packs.sh

      - name: Reclaim CUDA build scratch before backend packaging
        shell: bash
        run: cargo clean --manifest-path kapsl-runtime/Cargo.toml

      - name: Package certified managed-vLLM backend
        shell: bash
        env:
          KAPSL_VLLM_SDK_DIR: sdk-vllm
        run: .github/scripts/package-linux-vllm-backend.sh

      - name: Generate signed backend index
        shell: bash
        env:
          KAPSL_BACKEND_SIGNING_KEY_B64: ${{ secrets.KAPSL_BACKEND_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KAPSL_BACKEND_SIGNING_KEY_B64" ] || [ -z "$KAPSL_BACKEND_PUBLIC_KEYS" ]; then
            echo "Backend signing key and embedded public key are required." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/kapsl-backend-signing-key.pem"
          printf '%s' "$KAPSL_BACKEND_SIGNING_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          .github/scripts/generate-backend-index.py \
            --version "$KAPSL_VERSION" \
            --artifacts-dir dist \
            --output dist/backend-index.json \
            --signing-key "$key_file" \
            --expected-public-key "$KAPSL_BACKEND_PUBLIC_KEYS" \
            --channel beta
          rm -f "$key_file" dist/*.manifest.json
          trap - EXIT

      - name: Upload CUDA runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cuda-linux-x86_64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-beta-release:
    needs: [prepare-version, build-runtime-installers, build-cuda-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify installer artifact versions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare-version.outputs.version }}
          EXPECTED_DEB_VERSION: ${{ needs.prepare-version.outputs.deb_version }}
        run: |
          set -euo pipefail

          found=0
          mismatch=0
          while IFS= read -r -d '' file; do
            found=1
            name="$(basename "$file")"
            case "$name" in
              backend-index.json|backend-index.json.sig) continue ;;
            esac
            if [[ "$name" != *"$EXPECTED_VERSION"* && "$name" != *"$EXPECTED_DEB_VERSION"* ]]; then
              echo "Artifact '$name' does not contain the run version '$EXPECTED_VERSION' (or Debian form '$EXPECTED_DEB_VERSION')." >&2
              mismatch=1
            fi
          done < <(find release-assets -type f -print0)

          if [ "$found" -eq 0 ]; then
            echo "No installer artifacts were downloaded." >&2
            exit 1
          fi
          if [ "$mismatch" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare GitHub release assets
        shell: bash
        run: |
          set -euo pipefail

          release_limit_bytes=2147483648
          mkdir -p github-release-assets
          oversized_names="${RUNNER_TEMP}/oversized-release-assets.txt"
          : > "$oversized_names"

          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "$file")"
            name="$(basename "$file")"
            if [ "$size" -ge "$release_limit_bytes" ]; then
              echo "$name" >> "$oversized_names"
              echo "::warning file=$file::Skipping GitHub release asset '$name' because it is ${size} bytes; GitHub requires each release asset to be under ${release_limit_bytes} bytes. The full file remains in workflow artifacts and R2 uploads."
            fi
          done < <(find release-assets -type f -print0)

          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "$file")"
            name="$(basename "$file")"
            if [ "$size" -ge "$release_limit_bytes" ]; then
              continue
            fi
            if [[ "$name" == *.sha256 ]]; then
              asset_name="${name%.sha256}"
              if grep -Fxq "$asset_name" "$oversized_names"; then
                echo "Skipping orphan checksum for oversized GitHub release asset: $name"
                continue
              fi
            fi
            cp "$file" "github-release-assets/$name"
          done < <(find release-assets -type f -print0)

          if [ -s "$oversized_names" ]; then
            {
              echo "The following assets exceeded GitHub Releases' 2 GiB per-file limit and were not attached to this GitHub release:"
              echo
              while IFS= read -r name; do
                echo "- $name"
              done < "$oversized_names"
              echo
              echo "Use the R2 release path or workflow artifacts for these files."
            } > github-release-assets/OVERSIZED_RELEASE_ASSETS.txt
          fi

          if [ -z "$(find github-release-assets -type f -print -quit)" ]; then
            echo "No GitHub release assets were prepared."
            exit 1
          fi

          find github-release-assets -maxdepth 1 -type f -print | sort

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-version.outputs.version }}
          name: "Beta ${{ needs.prepare-version.outputs.version }}"
          prerelease: true
          generate_release_notes: true
          files: github-release-assets/**

      - name: Upload beta installers to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          release_root="s3://kapsl-installer/runtime/beta/v${{ needs.prepare-version.outputs.version }}"
          public_root="https://downloads.kapsl.net/runtime/beta/v${{ needs.prepare-version.outputs.version }}"

          aws s3 cp release-assets/ \
            "$release_root/" \
            --recursive \
            --exclude "backend-index.json" \
            --exclude "backend-index.json.sig" \
            --no-progress \
            --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com

          .github/scripts/verify-public-backend-release.sh \
            release-assets/backend-index.json \
            "$public_root" \
            --artifacts-only

          for name in backend-index.json.sig backend-index.json; do
            aws s3 cp "release-assets/$name" \
              "$release_root/$name" \
              --no-progress \
              --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com
          done

          .github/scripts/verify-public-backend-release.sh \
            release-assets/backend-index.json \
            "$public_root"

          # Keep the mutable latest directory as an exact mirror. Artifact names
          # contain their version, so --delete prevents old betas accumulating here.
          aws s3 sync release-assets/ \
            s3://kapsl-installer/runtime/beta/latest/ \
            --delete \
            --no-progress \
            --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com

          echo -n "${{ needs.prepare-version.outputs.version }}" \
            | aws s3 cp - \
              s3://kapsl-installer/runtime/beta/latest.txt \
              --content-type "text/plain" \
              --no-progress \
              --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com

          aws s3 cp installers/install.ps1 \
            s3://kapsl-installer/install-beta-base.ps1 \
            --content-type "text/plain" \
            --no-progress \
            --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com

          aws s3 cp installers/install.sh \
            s3://kapsl-installer/install-beta-base.sh \
            --content-type "text/plain" \
            --no-progress \
            --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com

          for script_path in \
            installers/install-beta.ps1 \
            installers/install-beta-cuda.ps1 \
            installers/install-beta-tensorrt.ps1 \
            installers/install-beta-cuda.sh \
            installers/install-beta.sh; do
            script="$(basename "$script_path")"
            aws s3 cp "$script_path" \
              "s3://kapsl-installer/$script" \
              --content-type "text/plain" \
              --no-progress \
              --endpoint-url https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com
          done

      - name: Retain current and rollback-compatible beta installers in R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          R2_ENDPOINT: https://b93d1b956d4a35c986540bb51f7404a2.r2.cloudflarestorage.com
          CURRENT_BETA_VERSION: v${{ needs.prepare-version.outputs.version }}
          KEEP_LATEST: "3"
        shell: bash
        run: |
          set -euo pipefail

          listing="$(aws s3 ls s3://kapsl-installer/runtime/beta/ \
            --endpoint-url "$R2_ENDPOINT")"
          mapfile -t versions < <(
            printf '%s\n' "$listing" \
              | awk '$NF ~ /^v.*\/$/ { sub(/\/$/, "", $NF); print $NF }'
          )
          protected_versions="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n "$KEEP_LATEST")"

          deleted=0
          for version in "${versions[@]}"; do
            if [ "$version" = "$CURRENT_BETA_VERSION" ]; then
              continue
            fi
            if grep -Fxq "$version" <<< "$protected_versions"; then
              continue
            fi

            echo "Deleting beta outside rollback window s3://kapsl-installer/runtime/beta/$version/"
            aws s3 rm "s3://kapsl-installer/runtime/beta/$version/" \
              --recursive \
              --only-show-errors \
              --endpoint-url "$R2_ENDPOINT"
            deleted=$((deleted + 1))
          done

          echo "Deleted $deleted beta version(s); retained the newest $KEEP_LATEST plus $CURRENT_BETA_VERSION."
